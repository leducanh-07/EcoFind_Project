<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ecofind-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#044e3d" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background container with rounded corners matching website header logo -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#ecofind-grad)" />

  <!-- EcoFind Compass Icon matching website navbar -->
  <g transform="translate(9, 9) scale(1.25)" filter="url(#subtle-shadow)">
    <!-- Outer compass dial ring -->
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Compass needle facets -->
    <polygon points="15.8,8.2 13.8,13.8 8.2,15.8 10.2,10.2" fill="#ffffff" fill-opacity="0.95" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center pivot dot -->
    <circle cx="12" cy="12" r="1.3" fill="#0d9488" />
  </g>
</svg>
