# =============================================================================
# EcoFind Nginx Configuration
# Task TE9C75A (DevOps / Reverse Proxy / NFR-SEC-02 HTTPS readiness)
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # Nén Gzip tối ưu hóa hiệu năng truyền tải tài nguyên tĩnh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cấu hình Web Root chứa bản build React
    root /usr/share/nginx/html;
    index index.html;

    # Tiêu chuẩn bảo mật HTTP Headers (NFR-SEC-02, NFR-SEC-04)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Phục vụ Single Page Application (SPA Router fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy chuyển hướng toàn bộ yêu cầu /api sang Backend FastAPI (Uvicorn)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 25M;
    }

    # Reverse Proxy cho thư mục ảnh tĩnh uploads
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Trang lỗi tùy biến
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

